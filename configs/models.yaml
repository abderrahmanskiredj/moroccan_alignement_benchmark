# =============================================================================
# Moroccan Alignment Benchmark — evaluated model registry
# =============================================================================
#
# Purpose
# -------
# This file defines the systems evaluated in the benchmark. It contains model
# identifiers and inference metadata only. Experimental scores must remain in
# outputs/final_results.xlsx and outputs/leaderboard.csv, not in this file.
#
# Important reproducibility rule
# ------------------------------
# For Hugging Face checkpoints, "revision: main" is allowed for the first
# download only. The inference script must resolve and save the full immutable
# commit SHA in every generation record and in the run manifest.
#
# API systems are configured using exact model IDs rather than moving aliases
# wherever a stable/pinned identifier is available.
#
# Last externally verified: 2026-07-27
# =============================================================================

schema_version: "1.0"

benchmark:
  name: "The Moroccan Alignment Benchmark"
  data_file: "data/02_final_benchmark/moroccan_alignment_benchmark.csv"
  system_prompt_file: "prompts/system_prompt.txt"
  output_directory: "outputs/generations"
  run_manifest_file: "outputs/generations/run_manifest.json"
  random_seed: 2026

# -----------------------------------------------------------------------------
# Shared inference policy
# -----------------------------------------------------------------------------

inference_defaults:
  input_modality: "text"
  use_chat_template: true
  add_generation_prompt: true
  continue_final_message: false

  # Prevent external retrieval or tool use from contaminating the benchmark.
  tools_enabled: false
  web_search_enabled: false
  search_grounding_enabled: false
  code_execution_enabled: false
  file_search_enabled: false
  url_context_enabled: false

  # Closed formats need only a short answer. Open questions receive a larger
  # allowance. The inference script should select the value by question_type.
  max_new_tokens_by_format:
    MCQ: 32
    Binary: 32
    Short: 128
    Open: 768

  deterministic_decoding:
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    top_k: null
    repetition_penalty: 1.0

  output_record:
    save_rendered_prompt: true
    save_raw_response: true
    save_finish_reason: true
    save_usage: true
    save_latency: true
    save_execution_timestamp_utc: true
    save_provider_request_id: true
    save_model_revision: true
    save_generation_parameters: true
    save_error_message: true

reproducibility:
  require_exact_model_id: true
  require_resolved_huggingface_commit_sha: true
  record_library_versions: true
  record_cuda_version: true
  record_gpu_name: true
  record_quantization: true
  record_tensor_parallel_size: true
  record_api_execution_date: true
  record_api_region_when_available: true
  fail_on_unknown_model: true
  fail_on_duplicate_model_key: true

# -----------------------------------------------------------------------------
# Provider configuration
# -----------------------------------------------------------------------------

providers:
  openai:
    backend: "openai_responses"
    api_key_environment_variable: "OPENAI_API_KEY"
    base_url_environment_variable: "OPENAI_BASE_URL"
    default_base_url: "https://api.openai.com/v1"
    timeout_seconds: 180
    max_retries: 5

  anthropic:
    backend: "anthropic_messages"
    api_key_environment_variable: "ANTHROPIC_API_KEY"
    base_url_environment_variable: "ANTHROPIC_BASE_URL"
    default_base_url: "https://api.anthropic.com"
    timeout_seconds: 180
    max_retries: 5

  google:
    backend: "google_genai"
    api_key_environment_variable: "GEMINI_API_KEY"
    timeout_seconds: 180
    max_retries: 5

  mistral:
    backend: "mistral_chat"
    api_key_environment_variable: "MISTRAL_API_KEY"
    base_url_environment_variable: "MISTRAL_BASE_URL"
    default_base_url: "https://api.mistral.ai/v1"
    timeout_seconds: 180
    max_retries: 5

  huggingface:
    backend: "vllm"
    token_environment_variable: "HF_TOKEN"
    cache_directory_environment_variable: "HF_HOME"
    default_dtype: "bfloat16"
    default_tensor_parallel_size: "auto"
    default_gpu_memory_utilization: 0.90
    default_max_model_length: null
    default_trust_remote_code: false

# =============================================================================
# Evaluated systems
# =============================================================================
#
# Field guide
# -----------
# key:
#   Stable internal identifier used in filenames and scripts.
#
# paper.display_name:
#   Name printed in the paper.
#
# paper.params_label:
#   Parameter label currently intended for the paper table.
#
# paper.table_group:
#   API reference or self-hosted group.
#
# model_id / checkpoint:
#   Exact provider model ID or Hugging Face repository.
#
# revision:
#   Hugging Face branch, tag, or commit. The full resolved SHA must be logged.
#
# request:
#   Provider-specific parameters. Null values must not be sent to the API.
#
# corrections:
#   Known differences between the abbreviated paper label and the exact public
#   model identifier or metadata. Review these before finalizing the paper.
# =============================================================================

evaluated_models:

  # ---------------------------------------------------------------------------
  # API reference systems
  # ---------------------------------------------------------------------------

  - key: "gpt_5_class"
    enabled: true
    access: "api"
    provider: "openai"
    backend: "openai_responses"

    paper:
      display_name: "GPT-5-class"
      params_label: "---"
      table_group: "api_reference"

    model_id: "gpt-5.6-sol"
    model_alias: null
    model_family: "GPT-5.6"
    developer: "OpenAI"
    parameters:
      disclosed: false
      architecture: "proprietary"

    request:
      reasoning_effort: "medium"
      temperature: null
      top_p: null
      seed: null
      max_output_tokens_from_format_defaults: true

    output_file: "outputs/generations/gpt-5-class.jsonl"

    corrections:
      mapped_from_generic_paper_label: true
      note: >
        The paper uses a class label. This configuration maps it to the exact
        current flagship endpoint gpt-5.6-sol. Replace the model_id if the
        reported experiment used a different GPT-5-family endpoint.

  - key: "claude_frontier"
    enabled: true
    access: "api"
    provider: "anthropic"
    backend: "anthropic_messages"

