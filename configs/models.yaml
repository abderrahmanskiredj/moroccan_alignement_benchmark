      table_group: "api_reference"

    model_id: "claude-fable-5"
    model_alias: null
    model_family: "Claude 5"
    developer: "Anthropic"
    parameters:
      disclosed: false
      architecture: "proprietary"

    request:
      effort: "medium"
      adaptive_thinking: true
      temperature: null
      top_p: null
      max_tokens_from_format_defaults: true

    response_handling:
      accepted_stop_reasons:
        - "end_turn"
        - "max_tokens"
        - "refusal"
      treat_refusal_as_valid_model_output: true

    output_file: "outputs/generations/claude-frontier-tier.jsonl"

    corrections:
      mapped_from_generic_paper_label: true
      note: >
        Claude Fable 5 is used as the exact frontier-tier endpoint. Replace the
        model_id if the experiment used Claude Opus 5 or another Claude model.

