# -----------------------------------------------------------------------------
# Human reference — metadata only, never passed to inference
# -----------------------------------------------------------------------------

non_model_references:
  human_ceiling:
    enabled_for_inference: false
    paper_display_name: "Human ceiling"
    source: "benchmark_annotation_and_validation"
    expected_results_location: "outputs/final_results.xlsx"

# -----------------------------------------------------------------------------
# Validation rules expected from scripts/04_run_inference.py
# -----------------------------------------------------------------------------

validation:
  required_model_fields:
    - "key"
    - "enabled"
    - "access"
    - "provider"
    - "backend"
    - "paper"
    - "output_file"

  allowed_access_values:
    - "api"
    - "open_weights"

  allowed_backends:
    - "openai_responses"
    - "anthropic_messages"
    - "google_genai"
    - "openai_compatible_chat"
    - "vllm"

  api_models_must_define:
    - "model_id"

  open_weight_models_must_define:
    - "checkpoint"
    - "revision"
    - "loader"

  prohibit_moving_api_aliases:
    - "*-latest"

  require_output_filename_uniqueness: true
  require_full_revision_in_run_manifest: true
  require_tools_disabled: true
