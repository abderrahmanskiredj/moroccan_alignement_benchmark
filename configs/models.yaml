# =============================================================================
# Moroccan Alignment Benchmark — evaluated model registry
# =============================================================================
#
# Golden source for evaluated systems: the final paper table supplied by the
# authors. This registry contains exactly those 17 evaluated systems.
# Experimental scores belong in outputs/final_results.xlsx / leaderboard files,
# not here.
#
# For Hugging Face checkpoints, revision: main is permitted as the retrieval
# reference, but the inference/run manifest should record the resolved immutable
# commit SHA used for the actual experiment whenever available.
# =============================================================================

schema_version: "1.0"

benchmark:
  name: "The Moroccan Alignment Benchmark"
  data_file: "data/02_final_benchmark/moroccan_alignment_benchmark.csv"
  system_prompt_file: "prompts/system_prompt.txt"
  output_directory: "outputs/generations"
  run_manifest_file: "outputs/generations/run_manifest.json"
  random_seed: 2026

# -----------------------------------------------------------------------------
# Shared inference policy
# -----------------------------------------------------------------------------

inference_defaults:
  input_modality: "text"
  use_chat_template: true
  add_generation_prompt: true
  continue_final_message: false

  tools_enabled: false
  web_search_enabled: false
  search_grounding_enabled: false
  code_execution_enabled: false
  file_search_enabled: false
  url_context_enabled: false

  max_new_tokens_by_format:
    MCQ: 32
    Binary: 32
    Short: 128
    Open: 768

  deterministic_decoding:
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    top_k: null
    repetition_penalty: 1.0

  output_record:
    save_rendered_prompt: true
    save_raw_response: true
    save_finish_reason: true
    save_usage: true
    save_latency: true
    save_execution_timestamp_utc: true
    save_provider_request_id: true
    save_model_revision: true
    save_generation_parameters: true
    save_error_message: true

reproducibility:
  require_exact_model_id: true
  require_resolved_huggingface_commit_sha: true
  record_library_versions: true
  record_cuda_version: true
  record_gpu_name: true
  record_quantization: true
  record_tensor_parallel_size: true
  record_api_execution_date: true
  record_api_region_when_available: true
  fail_on_unknown_model: true
  fail_on_duplicate_model_key: true

# -----------------------------------------------------------------------------
# Provider configuration
# -----------------------------------------------------------------------------

providers:
  openai:
    backend: "openai_responses"
    api_key_environment_variable: "OPENAI_API_KEY"
    base_url_environment_variable: "OPENAI_BASE_URL"
    default_base_url: "https://api.openai.com/v1"
    timeout_seconds: 180
    max_retries: 5

  anthropic:
    backend: "anthropic_messages"
    api_key_environment_variable: "ANTHROPIC_API_KEY"
    base_url_environment_variable: "ANTHROPIC_BASE_URL"
    default_base_url: "https://api.anthropic.com"
    timeout_seconds: 180
    max_retries: 5

  google:
    backend: "google_genai"
    api_key_environment_variable: "GEMINI_API_KEY"
    timeout_seconds: 180
    max_retries: 5

  xai:
    backend: "openai_compatible_chat"
    api_key_environment_variable: "XAI_API_KEY"
    base_url_environment_variable: "XAI_BASE_URL"
    default_base_url: "https://api.x.ai/v1"
    timeout_seconds: 180
    max_retries: 5

  huggingface:
    backend: "vllm"
    token_environment_variable: "HF_TOKEN"
    cache_directory_environment_variable: "HF_HOME"
    default_dtype: "bfloat16"
    default_tensor_parallel_size: "auto"
    default_gpu_memory_utilization: 0.90
    default_max_model_length: null
    default_trust_remote_code: false

